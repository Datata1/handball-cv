$schema: "https://moonrepo.dev/schemas/project.json"

# Superseded frontend, kept only so features can be read off / compared while
# they are migrated to the `frontend` project. Scheduled for deletion.
#
# Deliberately declares NO `lint` or `typecheck` task: this code is frozen and
# unlinted (its whole ui/ directory was excluded from eslint), so the
# all-projects `moon run :lint` / `:typecheck` forms must not pick it up.
# It is also absent from CI for the same reason.

language: typescript

tasks:
  setup:
    command: pnpm install
    inputs:
      - "package.json"
      - "pnpm-lock.yaml"
    options:
      runInCI: false

  run:
    command: pnpm dev
    deps:
      - "~:setup"
    options:
      persistent: true
      runInCI: false

  build:
    command: pnpm build
    deps:
      - "~:setup"
    inputs:
      - "src/**/*"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "postcss.config.mjs"
      - "package.json"
    outputs:
      - "dist"
    options:
      runInCI: false

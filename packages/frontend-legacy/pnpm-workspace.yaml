# pnpm >= 11 reads its settings from here, not from a "pnpm" field in
# package.json. The overrides block was migrated verbatim from that field so
# the vite pin keeps applying — without it pnpm silently resolves a newer vite.

overrides:
  vite: 6.3.5

# pnpm does not run dependency lifecycle scripts unless allowlisted. Both of
# these fetch a platform-specific native binary in their postinstall.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

$schema: "https://moonrepo.dev/schemas/project.json"

language: typescript

tasks:
  setup:
    command: pnpm install
    inputs:
      - "package.json"
      - "pnpm-lock.yaml"
    options:
      runInCI: false

  run:
    command: pnpm dev
    deps:
      - "~:setup"
    options:
      persistent: true
      runInCI: false

  # biome check = lint + formatter check + import sorting, over ts/tsx/css/json.
  lint:
    command: pnpm lint
    inputs:
      - "src/**/*"
      - ".storybook/**/*"
      - "biome.json"
      - "*.json"
      - "package.json"

  format:
    command: pnpm format
    inputs:
      - "src/**/*"
      - ".storybook/**/*"
      - "biome.json"
      - "*.json"
      - "package.json"
    options:
      runInCI: false

  typecheck:
    command: pnpm typecheck
    inputs:
      - "src/**/*.{ts,tsx}"
      - ".storybook/**/*.{ts,tsx}"
      - "tsconfig*.json"
      - "package.json"

  test:
    command: pnpm test
    inputs:
      - "src/**/*"
      - ".storybook/**/*"
      - "vitest.config.ts"
      - "package.json"

  # Not a CI gate: `test` already renders every story.
  build-storybook:
    command: pnpm build-storybook
    inputs:
      - "src/**/*"
      - ".storybook/**/*"
      - "vite.config.ts"
      - "package.json"
    outputs:
      - "storybook-static"
    options:
      runInCI: false

  build:
    command: pnpm build
    inputs:
      - "src/**/*"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
    outputs:
      - "dist"
